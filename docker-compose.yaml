services:
  initialize-permissions:
    image: ${ANI_DOCK_IMAGE:-ghcr.io/yuzheng14/ani-dock:latest}

    user: "0:0"
    command:
      - chown
      - -R
      - 10001:10001
      - /home/anidock/.ani-dock

    volumes:
      - ${ANI_DOCK_VOLUMES:-ani-dock-data}:/home/anidock/.ani-dock

    network_mode: "none"
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: "no"

  ani-dock:
    image: ${ANI_DOCK_IMAGE:-ghcr.io/yuzheng14/ani-dock:latest}

    build: .

    depends_on:
      initialize-permissions:
        condition: service_completed_successfully

    environment:
      ANI_DOCK_HOST: ${ANI_DOCK_HOST:-0.0.0.0}
      RUST_LOG: ${RUST_LOG:-info}

    ports:
      - ${ANI_DOCK_BIND_HOST:-127.0.0.1}:${ANI_DOCK_PORT:-6789}:6789

    volumes:
      - ${ANI_DOCK_VOLUMES:-ani-dock-data}:/home/anidock/.ani-dock

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:6789/api/health
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

    # startup a init process to clear ffmpeg subprocess
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  ani-dock-data:
