[package]
name = "ani-dock-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
directories = "6.0.0"
domparser = "0.0.7"
futures = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
m3u8-rs = "6.0.0"
nom = "7.1.3"
rand = "0.10.2"
regex = "1.13.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "process"] }
toml = { workspace = true }
tracing = { workspace = true }
url = "2.5.8"
wreq = {
  version = "5.3.0",
  features = [
    "cookies",
    "cookies-preserve-order",
    "deflate",
    "gzip",
    "json",
  ]
}
wreq-util = "2.2.6"

[dev-dependencies]
anyhow = "1.0.103"
tokio = { workspace = true, features = ["macros", "rt"] }
